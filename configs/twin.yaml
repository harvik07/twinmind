# Digital-twin configuration: line topology, the 18-D scenario space and the cost model.
name: twinmind-line-v1
seed: 42

simulation:
  # 28 to match the demand contract: Model B forecasts origin+1..origin+28, so a
  # longer twin horizon would be running on demand nobody forecast. This was 90,
  # while the simulator used 28, which is the kind of disagreement that stays
  # invisible until someone reads the config and believes it.
  horizon_days: 28
  warmup_days: 0          # see twin_design.md section 10: no warm-up is discarded
  time_step_minutes: 1
  default_replications: 20
  confidence_level: 0.95

# Five-station serial line with finite buffers between stations.
machines:
  - id: M1
    name: cutting
    nominal_rate_units_per_hour: 120.0
    buffer_capacity: 200
    repair_hours_mean: 4.0
    repair_hours_sd: 1.2
    pm_hours: 1.5
  - id: M2
    name: forming
    nominal_rate_units_per_hour: 110.0
    buffer_capacity: 200
    repair_hours_mean: 5.5
    repair_hours_sd: 1.8
    pm_hours: 2.0
  - id: M3
    name: welding
    nominal_rate_units_per_hour: 100.0
    buffer_capacity: 150
    repair_hours_mean: 6.0
    repair_hours_sd: 2.0
    pm_hours: 2.5
  - id: M4
    name: finishing
    nominal_rate_units_per_hour: 115.0
    buffer_capacity: 150
    repair_hours_mean: 3.5
    repair_hours_sd: 1.0
    pm_hours: 1.5
  - id: M5
    name: packing
    nominal_rate_units_per_hour: 130.0
    buffer_capacity: 300
    repair_hours_mean: 2.5
    repair_hours_sd: 0.8
    pm_hours: 1.0

shifts:
  hours_per_shift: 8.0
  working_days_per_week: 5
  max_overtime_hours_per_day: 4.0

suppliers:
  - id: S0
    name: incumbent
    lead_time_days_mean: 7.0
    lead_time_days_sd: 1.5
    unit_price: 12.00
    reliability: 0.95
  - id: S1
    name: premium_local
    lead_time_days_mean: 3.0
    lead_time_days_sd: 0.5
    unit_price: 14.50
    reliability: 0.99
  - id: S2
    name: low_cost_offshore
    lead_time_days_mean: 21.0
    lead_time_days_sd: 6.0
    unit_price: 9.25
    reliability: 0.88

# ---------------------------------------------------------------------------
# Scenario space: exactly 18 decision dimensions. Order here is the canonical
# vector order used by the surrogate, the optimisers and the agent.
# ---------------------------------------------------------------------------
scenario_space:
  - name: throughput_multiplier
    kind: continuous
    min: 0.70
    max: 1.30
    default: 1.00
    description: Scales the target production rate of the whole line.
  - name: shift_count
    kind: integer
    min: 1
    max: 3
    default: 2
    description: Number of 8-hour shifts run per working day.
  - name: overtime_hours
    kind: continuous
    min: 0.0
    max: 4.0
    default: 0.0
    description: Paid overtime hours appended to each working day.
  - name: pm_interval_M1
    kind: continuous
    min: 24.0
    max: 720.0
    default: 168.0
    description: Preventive-maintenance interval for M1, in operating hours.
  - name: pm_interval_M2
    kind: continuous
    min: 24.0
    max: 720.0
    default: 168.0
    description: Preventive-maintenance interval for M2, in operating hours.
  - name: pm_interval_M3
    kind: continuous
    min: 24.0
    max: 720.0
    default: 120.0
    description: Preventive-maintenance interval for M3, in operating hours.
  - name: pm_interval_M4
    kind: continuous
    min: 24.0
    max: 720.0
    default: 168.0
    description: Preventive-maintenance interval for M4, in operating hours.
  - name: pm_interval_M5
    kind: continuous
    min: 24.0
    max: 720.0
    default: 240.0
    description: Preventive-maintenance interval for M5, in operating hours.
  - name: speed_setpoint_M1
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M1 as a fraction of nominal rate.
  - name: speed_setpoint_M2
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M2 as a fraction of nominal rate.
  - name: speed_setpoint_M3
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M3 as a fraction of nominal rate.
  - name: speed_setpoint_M4
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M4 as a fraction of nominal rate.
  - name: speed_setpoint_M5
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M5 as a fraction of nominal rate.
  - name: supplier_choice
    kind: categorical
    min: 0
    max: 2
    default: 0
    description: Index into the suppliers list (0=S0, 1=S1, 2=S2).
  - name: reorder_point
    kind: continuous
    min: 0.0
    max: 9000.0
    default: 7000.0
    description: >
      Raw-material inventory POSITION (on hand + on order) that triggers a
      replenishment order. Default raised from 1200: at the baseline's ~970
      units/day the incumbent supplier's 7-day lead means 6,800 units are
      consumed while an order is in transit, so a 1,200 trigger starves the
      line for days at a time. Max raised to 9000 so the optimiser can cover a
      21-day offshore lead if it wants S2.
  - name: order_quantity
    kind: continuous
    min: 100.0
    max: 10000.0
    default: 6000.0
    description: >
      Units requested per replenishment order. Default raised from 2500 for a
      structural reason worth stating: with (s, Q) on inventory POSITION, a Q
      larger than s means one delivery lifts the position above the trigger, so
      a second order can never be in flight and supply is capped at Q per lead
      time -- 357 units/day at Q=2500 with a 7-day lead, against ~970 demanded.
      Keeping Q below s is what lets orders overlap.
  - name: safety_stock
    kind: continuous
    min: 0.0
    max: 4000.0
    default: 1500.0
    description: >
      Buffer stock, applied as an offset that RAISES the reorder trigger rather
      than as an untouchable floor. A floor that can never be consumed is not
      safety stock, it is a smaller warehouse.
  - name: price_multiplier
    kind: continuous
    min: 0.85
    max: 1.25
    default: 1.00
    description: Scales the selling price, feeding back into realised demand.

costs:
  currency: GBP
  preventive_maintenance_per_event: 500.0
  corrective_maintenance_per_event: 2500.0   # 5x preventive, by design
  downtime_per_hour: 850.0
  labour_per_operator_hour: 22.0
  overtime_multiplier: 1.5
  holding_cost_per_unit_per_day: 0.12
  stockout_penalty_per_unit: 18.0
  late_delivery_penalty_per_order: 250.0
  raw_material_per_unit: 12.00            # overridden by the chosen supplier price
  base_selling_price_per_unit: 45.00
  energy_per_machine_hour: 6.50
  fixed_overhead_per_day: 4200.0

constraints:
  min_on_time_delivery_rate: 0.90
  max_stockout_probability: 0.05
  max_unit_cost: 40.0
  min_oee: 0.55

# ===========================================================================
# ASSUMPTIONS REGISTER
#
# No real factory data exists for this line. Every parameter below is an
# engineering assumption, not a measurement, and each is flagged
# `assumed: true` with the reason it was chosen. Section 6 of
# reports/model_cards/twin_design.md reports how far the headline KPIs and the
# RANKING of scenarios move when each one is wrong (+-25% one-at-a-time, with
# common random numbers, 30 reps).
#
# Parameters NOT in this register are data-backed: the C-MAPSS degradation
# trajectories, the A1 health predictions replayed from them, and the Favorita
# demand paths all come from models trained and validated on real data.
# ===========================================================================
assumptions:
  # --- Ageing: how operating hours map onto C-MAPSS cycles -----------------
  life_scale_hours_per_cycle:
    value: 1.40
    assumed: true
    reason: >
      C-MAPSS cycles are flights, not factory hours, so some mapping must be
      invented. mean_life_operating_days x 16 h / 205.3 mean pool cycles, with
      mean_life_operating_days = 18, gives 1.40. The spec asked for 40 days,
      but 40 two-shift days is 640 operating hours and a 28-day window only
      contains 320 staffed hours (the line works five days in seven), so at 40
      days NOTHING ever fails and the maintenance levers do nothing at all --
      measured: 0 failures and 0 PM events across the baseline. 18 days is the
      value at which failures actually occur inside the horizon. See the
      "where the spec was wrong" section of the model card.
  mean_life_operating_days:
    value: 18.0
    assumed: true
    reason: >
      Target used to derive life_scale_hours_per_cycle. Recorded separately so
      the sensitivity study can perturb the intent rather than the derived
      constant.
  wear_exponent:
    value: 2.0
    assumed: true
    reason: >
      Ageing rate scales as speed^wear_exponent, so running 20% fast consumes
      life 44% faster. A quadratic is the conventional first guess for
      mechanical wear against speed; no data here supports any exponent.
  # --- Speed, quality and energy ------------------------------------------
  defect_base_probability:
    value: 0.012
    assumed: true
    reason: Nominal scrap rate at speed 1.0. No quality data exists for this line.
  defect_speed_exponent:
    value: 3.0
    assumed: true
    reason: >
      Defect probability scales as base x speed^exponent, so speed buys
      throughput at an accelerating quality cost. This is the mechanism that
      stops "maximum speed everywhere" from being free; the landscape check in
      the card tests whether it is strong enough.
  energy_speed_exponent:
    value: 2.0
    assumed: true
    reason: Energy per machine-hour scales as speed^2, the usual fan/pump law.
  # --- Processing variability ----------------------------------------------
  processing_cv:
    value: 0.25
    assumed: true
    reason: >
      Lognormal coefficient of variation on lot processing time. Sets how much
      blocking and starving the finite buffers actually produce; with CV=0 the
      line would be deterministic and the buffers pointless.
  # --- Repair durations ----------------------------------------------------
  planned_repair_multiplier:
    value: 1.0
    assumed: true
    reason: >
      Planned maintenance takes pm_hours from the machine block. Unplanned
      repairs use repair_hours_mean/sd. The split exists because an unplanned
      failure costs diagnosis time a scheduled job does not.
  unplanned_repair_multiplier:
    value: 1.0
    assumed: true
    reason: Scales repair_hours_mean, so the sensitivity study can perturb it.
  # --- Demand coupling -----------------------------------------------------
  demand_scale:
    value: 1.0
    assumed: true
    reason: >
      Multiplies the Favorita demand path so mean demand is about
      demand_capacity_ratio of nominal plant capacity at the baseline scenario.
      Resolved at load time by calibrate_demand_scale; 1.0 means uncalibrated.
      Favorita units are grocery units, not units of this product, so some
      rescaling is unavoidable.
  demand_capacity_ratio:
    value: 0.85
    assumed: true
    reason: >
      Target mean demand as a fraction of nominal capacity. Below 1.0 so the
      line is not permanently demand-saturated, which would make every
      throughput lever worthless.
  price_elasticity:
    value: -1.2
    assumed: true
    reason: >
      Demand multiplies by price_multiplier^elasticity. Favorita carries no
      price column, so no elasticity can be estimated from it. -1.2 is a
      conventional mildly-elastic grocery value.
  demand_spread_multiplier:
    value: 1.0
    assumed: true
    reason: >
      Rescales each sampled demand path's deviation from its own median.
      Exists because Model B's post-conformal coverage is uneven -- d8-14
      averages 0.716 against a [0.76, 0.84] target, and on fold 1 an 80%
      interval covered 65% of outcomes -- so the twin's demand paths are
      probably too NARROW at mid-horizon and stockout risk is probably
      UNDERSTATED. Applied inside the twin after sample_paths, never inside the
      frozen DemandModel Protocol. Perturbed over {0.8, 1.0, 1.2, 1.4}.
  # --- Supply --------------------------------------------------------------
  supplier_short_ship_fraction:
    value: 0.7
    assumed: true
    reason: >
      When a supplier misses its reliability draw it delivers this fraction of
      the order rather than nothing. A binary all-or-nothing failure would be a
      harsher assumption with no more support.
  lead_time_multiplier:
    value: 1.0
    assumed: true
    reason: Scales supplier lead_time_days_mean, for the sensitivity study.

# ---------------------------------------------------------------------------
# Lot-based flow. One SimPy event per LOT, not per unit: a 28-day run moves
# roughly 4,500 lots rather than 45,000 units, which is what makes the 0.25
# s/run budget reachable.
# ---------------------------------------------------------------------------
flow:
  lot_size: 10
  # Must cover demand over a supplier lead time, or the line starves before the
  # first delivery arrives and no inventory policy can recover. At the baseline
  # (about 970 units/day) the incumbent's 7-day lead needs roughly 6,800 units
  # in the yard on day zero; 8,000 leaves a little slack.
  initial_raw_inventory: 8000.0
  initial_finished_inventory: 0.0

labour:
  operators_per_shift: 5

# ---------------------------------------------------------------------------
# Health coupling. Failures are REPLAYED from real C-MAPSS run-to-failure
# trajectories; the health model plays the monitoring system and issues
# warnings from cached predictions. Sampling failures from the model's own
# predicted distribution would be circular.
# ---------------------------------------------------------------------------
health_replay:
  subset: FD002
  model_seed: 42
  checkpoint: models/a1_hct/a1_FD002_hct_seed42.pt
  cache_path: models/health_cache
  # "learned"    = replayed trajectories + cache-driven early warnings
  # "fixed_mtbf" = lifetimes from a Weibull fitted to the pool, no warnings
  hazard_source: learned
  # Chosen, not measured, and chosen for a specific declared reason. The twin's
  # ageing gives a 30-cycle failure horizon about 42 processing hours of notice,
  # and early-warning PM is scheduled at the next shift end (at most 16 h away),
  # so a sensitive threshold catches EVERYTHING and unplanned_failures is
  # identically zero -- a degenerate KPI and a maintenance lever with nothing to
  # trade. Measured over 8 seeds with PM intervals at their upper bound:
  #
  #   threshold   unplanned failures   PM events   mean warning lead
  #     0.50            0.00              4.12          56.0 h
  #     0.80            0.00              3.50          22.9 h
  #     0.90            0.00              3.12          12.5 h
  #     0.95            0.62              2.50           6.3 h
  #     0.99            2.88              0.12           1.8 h
  #
  # 0.95 is where the monitor is informative but imperfect. This is the
  # "fix the structure and say so" step the landscape check calls for.
  warning_threshold: 0.95
  min_pool_engines: 40

# Digital-twin configuration: line topology, the 18-D scenario space and the cost model.
name: twinmind-line-v1
seed: 42

simulation:
  horizon_days: 90
  warmup_days: 7          # discarded before KPIs are accumulated
  time_step_minutes: 1
  default_replications: 20
  confidence_level: 0.95

# Five-station serial line with finite buffers between stations.
machines:
  - id: M1
    name: cutting
    nominal_rate_units_per_hour: 120.0
    buffer_capacity: 200
    repair_hours_mean: 4.0
    repair_hours_sd: 1.2
    pm_hours: 1.5
  - id: M2
    name: forming
    nominal_rate_units_per_hour: 110.0
    buffer_capacity: 200
    repair_hours_mean: 5.5
    repair_hours_sd: 1.8
    pm_hours: 2.0
  - id: M3
    name: welding
    nominal_rate_units_per_hour: 100.0
    buffer_capacity: 150
    repair_hours_mean: 6.0
    repair_hours_sd: 2.0
    pm_hours: 2.5
  - id: M4
    name: finishing
    nominal_rate_units_per_hour: 115.0
    buffer_capacity: 150
    repair_hours_mean: 3.5
    repair_hours_sd: 1.0
    pm_hours: 1.5
  - id: M5
    name: packing
    nominal_rate_units_per_hour: 130.0
    buffer_capacity: 300
    repair_hours_mean: 2.5
    repair_hours_sd: 0.8
    pm_hours: 1.0

shifts:
  hours_per_shift: 8.0
  working_days_per_week: 5
  max_overtime_hours_per_day: 4.0

suppliers:
  - id: S0
    name: incumbent
    lead_time_days_mean: 7.0
    lead_time_days_sd: 1.5
    unit_price: 12.00
    reliability: 0.95
  - id: S1
    name: premium_local
    lead_time_days_mean: 3.0
    lead_time_days_sd: 0.5
    unit_price: 14.50
    reliability: 0.99
  - id: S2
    name: low_cost_offshore
    lead_time_days_mean: 21.0
    lead_time_days_sd: 6.0
    unit_price: 9.25
    reliability: 0.88

# ---------------------------------------------------------------------------
# Scenario space: exactly 18 decision dimensions. Order here is the canonical
# vector order used by the surrogate, the optimisers and the agent.
# ---------------------------------------------------------------------------
scenario_space:
  - name: throughput_multiplier
    kind: continuous
    min: 0.70
    max: 1.30
    default: 1.00
    description: Scales the target production rate of the whole line.
  - name: shift_count
    kind: integer
    min: 1
    max: 3
    default: 2
    description: Number of 8-hour shifts run per working day.
  - name: overtime_hours
    kind: continuous
    min: 0.0
    max: 4.0
    default: 0.0
    description: Paid overtime hours appended to each working day.
  - name: pm_interval_M1
    kind: continuous
    min: 24.0
    max: 720.0
    default: 168.0
    description: Preventive-maintenance interval for M1, in operating hours.
  - name: pm_interval_M2
    kind: continuous
    min: 24.0
    max: 720.0
    default: 168.0
    description: Preventive-maintenance interval for M2, in operating hours.
  - name: pm_interval_M3
    kind: continuous
    min: 24.0
    max: 720.0
    default: 120.0
    description: Preventive-maintenance interval for M3, in operating hours.
  - name: pm_interval_M4
    kind: continuous
    min: 24.0
    max: 720.0
    default: 168.0
    description: Preventive-maintenance interval for M4, in operating hours.
  - name: pm_interval_M5
    kind: continuous
    min: 24.0
    max: 720.0
    default: 240.0
    description: Preventive-maintenance interval for M5, in operating hours.
  - name: speed_setpoint_M1
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M1 as a fraction of nominal rate.
  - name: speed_setpoint_M2
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M2 as a fraction of nominal rate.
  - name: speed_setpoint_M3
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M3 as a fraction of nominal rate.
  - name: speed_setpoint_M4
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M4 as a fraction of nominal rate.
  - name: speed_setpoint_M5
    kind: continuous
    min: 0.80
    max: 1.20
    default: 1.00
    description: Speed setpoint for M5 as a fraction of nominal rate.
  - name: supplier_choice
    kind: categorical
    min: 0
    max: 2
    default: 0
    description: Index into the suppliers list (0=S0, 1=S1, 2=S2).
  - name: reorder_point
    kind: continuous
    min: 0.0
    max: 5000.0
    default: 1200.0
    description: Raw-material inventory level that triggers a replenishment order.
  - name: order_quantity
    kind: continuous
    min: 100.0
    max: 10000.0
    default: 2500.0
    description: Units requested per replenishment order.
  - name: safety_stock
    kind: continuous
    min: 0.0
    max: 4000.0
    default: 800.0
    description: Buffer stock held above the reorder point.
  - name: price_multiplier
    kind: continuous
    min: 0.85
    max: 1.25
    default: 1.00
    description: Scales the selling price, feeding back into realised demand.

costs:
  currency: GBP
  preventive_maintenance_per_event: 500.0
  corrective_maintenance_per_event: 2500.0   # 5x preventive, by design
  downtime_per_hour: 850.0
  labour_per_operator_hour: 22.0
  overtime_multiplier: 1.5
  holding_cost_per_unit_per_day: 0.12
  stockout_penalty_per_unit: 18.0
  late_delivery_penalty_per_order: 250.0
  raw_material_per_unit: 12.00            # overridden by the chosen supplier price
  base_selling_price_per_unit: 45.00
  energy_per_machine_hour: 6.50
  fixed_overhead_per_day: 4200.0

constraints:
  min_on_time_delivery_rate: 0.90
  max_stockout_probability: 0.05
  max_unit_cost: 40.0
  min_oee: 0.55

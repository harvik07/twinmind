# Hooks run on staged files at commit time. Install once per clone with:
#   python -m pre_commit install
# Run across the whole tree with:
#   python -m pre_commit run --all-files
#
# Notebooks are excluded from the text-fixing hooks: .ipynb is JSON, and
# stripping trailing whitespace or rewriting the final newline inside it
# produces diffs that are noise at best and invalid JSON at worst. They are
# generated by scripts/build_notebooks.py anyway.

default_language_version:
  python: python3.11

exclude: '^notebooks/.*\.ipynb$'

# ruff is pinned exactly, here and in pyproject.toml, because it is a
# formatter: `~=0.6` on a 0.x package resolves to any 0.x, so CI and the
# hook would silently run different versions and disagree on formatting.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff
        name: ruff (lint)
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff (format)

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      # 1 MB ceiling. data/ and models/ are gitignored, but the ignore rules
      # only cover paths that were anticipated -- this catches a stray parquet,
      # checkpoint or figure wherever it lands.
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "twinmind"
version = "0.1.0"
description = "Agentic deep-learning digital twin of a manufacturing line"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Harvik" }]

dependencies = [
    "torch~=2.4",
    "numpy~=1.26",
    "pandas~=2.2",
    "pyarrow~=21.0",
    "scipy~=1.13",
    "scikit-learn~=1.5",
    "lightgbm~=4.5",
    "simpy~=4.1",
    "pydantic~=2.8",
    "pyyaml~=6.0",
    "duckdb~=1.0",
    "optuna~=4.0",
    "langgraph~=0.2",
    "groq~=0.11",
    "streamlit~=1.38",
    "plotly~=5.24",
    "python-dotenv~=1.0",
    "tqdm~=4.66",
    "requests~=2.32",
    "ucimlrepo~=0.0.7",
    "kaggle>=2.2,<3",
    "matplotlib~=3.9",
    "seaborn~=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-cov~=5.0",
    "ruff==0.16.5",
    "mypy~=1.11",
    "types-PyYAML~=6.0",
    "types-requests~=2.32",
    "nbformat~=5.10",
    "nbconvert~=7.16",
    "ipykernel~=6.29",
    "pre-commit~=4.0",
]
forecast = [
    "neuralforecast~=1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Scenario/config field names embed machine ids (M1..M5) so they match the ids in
# twin.yaml exactly. N815 would force pm_interval_m1, which no longer matches.
"src/twinmind/twin/runner.py" = ["N815"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "data: requires downloaded datasets in data/raw (deselect with -m 'not data')",
]
